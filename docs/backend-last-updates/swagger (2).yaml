openapi: 3.0.3
info:
  title: Glace API
  description: |
    API specification for the Glace storefront (Next.js) and Filament admin.

    **Source of truth for open backend work:** `docs/backend-handoff/`
    (`01` … `07`) and `docs/backend-last-updates/` (`08` … `17`). This file
    encodes the agreed contract.

    ### Authentication (handoff 08)
    Passwordless. The token from `/auth/otp/verify` is sent as a BARE
    `Authorization: <token>` header — **no `Bearer` prefix** — matching the
    storefront axios interceptor. The old password schemas (`LoginRequest`,
    `RegisterRequest`, `RestorePasswordRequest`, `NewPasswordRequest`,
    `ChangePasswordRequest`) are cancelled and absent from this file.

    ### Server-side pricing (handoff 11 · 12)
    `POST /orders` recomputes every amount from the catalog. Prices and
    discounts sent by the client are read by nothing.

    ### Media URLs (handoff 01 · 03 · 04)
    Every image field (`format: uri`) MUST be an **absolute** URL from
    `Storage::disk('public')->url(...)` (or a real CDN), e.g.
    `https://host/storage/products/….png`.
    - Relative paths (`products/…`, `hero-slides/…`) are **rejected by contract**.
    - Dead hosts (`cdn.example.com`, `example.com`) are **rejected**.

    ### Dashboard-driven catalogs (handoff 05 · 07 · 01)
    Builder `containerOptions` / `sizes` / prices, flat-list `items` (+ images),
    and flat-list `mixes` are edited in Filament and reflected immediately on
    `GET /menu/products` and `GET /menu/products/{slug}`.

    ### Booleans
    Never drop `false` fields. Especially `flavors[].available` and
    `mixes[].available` — omit-when-false breaks the frontend parse.

    ### Brad-boza media (handoff 06)
    Product has a **single** hero `image`. Do **not** send `secondaryImage`
    or any companion cup/scoop asset.
  version: 1.2.0
  contact:
    name: Glace Team

servers:
  - url: http://acw348d983gr8x01lb5myd3x.64.176.172.179.sslip.io/api
    description: Current backend (NEXT_PUBLIC_API_URL)
  - url: https://glace-bzjj.onrender.com/api
    description: Staging (Render)
  - url: http://localhost:8000/api
    description: Backend API (local)
  # NOTE: never use `cdn.example.com` / `api.example.com` in live payloads.
  # Examples below use `cdn.glace.ps` as the intended production CDN shape;
  # storage absolute URLs (`…/storage/…`) are equally valid.

tags:
  - name: Home
    description: Home page content
  - name: Menu
    description: Menu categories and items
  - name: Events
    description: Events and promotions
  - name: Contact
    description: Contact and support forms
  - name: Auth
    description: Passwordless sign-in by SMS code (handoff 08)
  - name: Account
    description: Customer profile (handoff 09)
  - name: Addresses
    description: Saved delivery addresses and zones (handoff 10)
  - name: Cart
    description: Coupons (handoff 11)
  - name: Orders
    description: Placing and tracking orders (handoff 12)
  - name: Payments
    description: Manual-transfer accounts (handoff 13)
  - name: Wallet
    description: Store credit (handoff 14)
  - name: Content
    description: Dashboard-owned pages — FAQs, terms, privacy (handoff 15-17)

paths:
  /home:
    get:
      tags: [Home]
      summary: Get home page content
      description: |
        Public aggregate endpoint for the entire home page.
        Returns hero slides, about, why-glace, branches, and events
        in a single response so the frontend can load the page with one request.

        **Contract notes (handoff 04):**
        - All image fields = absolute URLs (`Storage::url` / real CDN).
        - `about.paragraphs` = `string[]` (NOT `[{ "text": "..." }]`).
        - `events.items` length up to **10** (latest first), each with a real
          card image when available.
        - `whyGlace.features[]` = `{ label }` only — do not send `image`.
      operationId: getHomePage
      security: []
      responses:
        "200":
          description: Home page content (`IHomePageData`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IHomePageData"
              example:
                hero:
                  slides:
                    - manImg: https://cdn.glace.ps/home/hero/man-1.png
                      pieceImg: https://cdn.glace.ps/home/hero/piece-1.png
                      zigzagsImg: https://cdn.glace.ps/home/hero/zigzags.png
                      titleH1: جلاسية الأمير
                      titleH2: لإنتاج الآيس كريم و البراد و العصائر و الحلويات
                      bgColor: "#51C9F4"
                      headerBgColor: "#51c9f4"
                      h1BgColor: "#53352a"
                      h2BgColor: "#51c9f4"
                about:
                  title: موهوبون في صناعة الأيسكريم !
                  paragraphs:
                    - تأسس جلاسيه الأمير عام 2015 كأحد أفرع شركة أسكمو الأمير...
                    - تعمل الشركة على تقديم أجود أنواع الآيس كريم والبراد...
                  image: https://cdn.glace.ps/home/about/character.png
                  ctaLabel: اعرف أكثر
                  ctaHref: /about
                whyGlace:
                  title: لماذا جلاسيه الأمير؟
                  description: جلاسيه الأمير حاصلة على شهادة الجودة العالمية لسلامة الغذاء ISO 22000
                  features:
                    - label: جودة عالية
                    - label: أمانة وثقة
                  videoUrl: https://www.youtube.com/embed/ShMr0XzIqSM
                  videoThumbnail: https://cdn.glace.ps/home/why/video-thumb.png
                branches:
                  title: ننتظركم في المواعيد التالية
                  branches:
                    - id: ramal
                      label: فرع الرمال
                      mapSrc: https://www.google.com/maps/embed?...
                      address: غزة، الرمال، شارع الشهداء...
                      phone: "0592 226 522"
                      whatsapp: "0592 226 522"
                      weekdayHours: "PM 11:45 – AM 10:00"
                      fridayHours: "PM 11:45 – PM02:00"
                      borderRadius: "32% 68% 69% 31% / 30% 28% 72% 70%"
                events:
                  title: الفعاليات و المناسبات
                  moreLabel: عرض المزيد
                  moreHref: /events
                  items:
                    - id: 1
                      title: مشارك معرض الصناعات الغذائية الفلسطينية
                      image: https://cdn.glace.ps/home/events/1.png
                      href: /events/1
        "500":
          $ref: "#/components/responses/ServerError"

  /events:
    get:
      tags: [Events]
      summary: List events
      description: |
        Public paginated list of events for `/events`.
        Matches TypeScript `IEventsListResponse` / `IEvent`.

        **Contract (handoff 04):** every listed event SHOULD have a non-null
        `listImage` absolute URL. `images` must be a string array with **no
        `null` entries** (empty `[]` if no gallery yet).
      operationId: getEvents
      security: []
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
          example: 1
        - name: perPage
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 8
          example: 8
      responses:
        "200":
          description: Paginated events list (`IEventsListResponse`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IEventsListResponse"
              example:
                items:
                  - id: 2
                    title: أجواء العيد مع جلاسيه غير
                    date: "11/06/2020"
                    description: كل عام وانتم بخير بحلول عيد الفطر المبارك...
                    listImage: https://cdn.glace.ps/events/2-list.png
                    images:
                      - https://cdn.glace.ps/events/2-a.png
                      - https://cdn.glace.ps/events/2-b.png
                total: 10
                page: 1
                perPage: 8
                totalPages: 2
        "500":
          $ref: "#/components/responses/ServerError"

  /events/{id}:
    get:
      tags: [Events]
      summary: Get event by id
      description: |
        Public event detail for `/events/{id}`.
        Matches TypeScript `IEvent`.

        **Contract (handoff 04):** `images` is the detail gallery — absolute
        URL strings only. Never return `[null, null, …]`. Manage uploads from
        Filament (multi-file / repeater), not card image alone.
      operationId: getEventById
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
          example: 2
      responses:
        "200":
          description: Event detail (`IEvent`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IEvent"
              example:
                id: 2
                title: أجواء العيد مع جلاسيه غير
                date: "11/06/2020"
                description: كل عام وانتم بخير بحلول عيد الفطر المبارك احتفالنا معكم بالعيد أجمل...
                listImage: https://cdn.glace.ps/events/2-list.png
                images:
                  - https://cdn.glace.ps/events/2-a.png
                  - https://cdn.glace.ps/events/2-b.png
                  - https://cdn.glace.ps/events/2-c.png
                  - https://cdn.glace.ps/events/2-d.png
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"

  /contact:
    post:
      tags: [Contact]
      summary: Send contact message
      description: |
        Public contact form submission.
        Matches TypeScript `IContactRequest` → `IContactResponse`.
      operationId: sendContactMessage
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IContactRequest"
            example:
              name: أحمد علي
              phone: "0592123456"
              email: ahmed@example.com
              message: أريد الاستفسار عن العروض الحالية
      responses:
        "200":
          description: Message accepted (`IContactResponse`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IContactResponse"
              example:
                success: true
                message: تم إرسال رسالتك بنجاح
        "422":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/ServerError"

  /menu/categories:
    get:
      tags: [Menu]
      summary: List menu categories
      description: |
        Public list of browse-grid category tabs for `/menu`.
        Matches TypeScript `IMenuCategory`.
      operationId: getMenuCategories
      security: []
      responses:
        "200":
          description: Menu categories (`IMenuCategory[]`)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/IMenuCategory"
              example:
                - id: pancake
                  label: بان كيك
                  icon: cake
                  accentColor: "#f4a851"
                  gradientFrom: "#f4a851"
                  gradientTo: "#c97d2a"
                  sortOrder: 11
        "500":
          $ref: "#/components/responses/ServerError"

  /menu/products:
    get:
      tags: [Menu]
      summary: List products
      description: |
        Public list of orderable/reference products, optionally filtered by
        category. Matches TypeScript `IProduct` — a discriminated union on
        `kind` (`builder` | `flat-list`).

        **Contract (handoff 01 · 02 · 03 · 05 · 07):**
        - Filter query is **`category`** (= `IMenuCategory.id`). Do **not**
          treat `categoryId` as a silent alias — return **422** (or ignore
          explicitly). Never return the full unfiltered catalog when a wrong
          filter key was sent as if filtering succeeded.
        - List rows MUST **omit** `flavors[]` (detail-only).
        - Flat-list `items[].image` is **required** on every item.
        - Builder `containerOptions` / `sizes` and flat-list `mixes` are
          Filament-managed and must round-trip here.
      operationId: getMenuProducts
      security: []
      parameters:
        - name: category
          in: query
          required: false
          description: |
            Filter by `IMenuCategory.id`. Wrong key `categoryId` is not
            supported — respond 422 ValidationError (handoff 03).
          schema:
            type: string
          example: pancake
      responses:
        "200":
          description: Products (`IProduct[]`)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/IProduct"
              example:
                - id: "a1c3e5f7-1111-4b22-9c33-aa44bb55cc66"
                  slug: pancake
                  categoryId: pancake
                  kind: flat-list
                  name: بان كيك
                  description: بان كيك طازج بنكهات متنوعة
                  image: https://cdn.glace.ps/menu/pancake.jpg
                  sortOrder: 1
                  available: true
                  inStoreOnly: true
                  hasFavorites: true
                  hasNotes: true
                  addons:
                    - id: extra-nutella
                      label: صوص نوتيلا إضافي
                      price: 4
                      available: true
                    - id: extra-nuts
                      label: بندق مبشور
                      price: 4
                      available: true
                  items:
                    - id: nutella
                      label: نوتيلا
                      price: 11
                      available: true
                      description: بان كيك بصوص النوتيلا
                      image: https://cdn.glace.ps/menu/pancake-nutella.jpg
                    - id: lotus
                      label: لوتس
                      price: 13
                      available: true
                      image: https://cdn.glace.ps/menu/pancake-lotus.jpg
                    - id: pistachio
                      label: بيستاشيو
                      price: 17
                      available: true
                      isPremiumMixFlavor: true
                      image: https://cdn.glace.ps/menu/pancake-pistachio.jpg
                  mixes:
                    - id: mix
                      label: مكس (اختر طعمين)
                      available: true
                      pick: 2
                      basePrice: 14
                      flavorPrice: 7
                      premiumFlavorPrice: 11
                      itemIds: [nutella, lotus, pistachio]
                - id: "b7f1c2a4-9e3d-4a10-8c21-3f5a2d1e9b04"
                  slug: cup
                  categoryId: ice-cream
                  kind: builder
                  name: بوظة كاسة
                  image: https://cdn.glace.ps/menu/cup.jpg
                  sortOrder: 1
                  available: true
                  selectionMode: repeatable
                  flavorFamilies: [classic, special, mix]
                  hasExtraBiscuitAddon: true
                  containerOptions:
                    - id: cup
                      label: كاسة
                      available: true
                    - id: biscuit
                      label: بسكوت
                      available: true
                      name: بوظة بسكوت
                      image: https://cdn.glace.ps/menu/biscuit.jpg
                  sizes:
                    - id: cup-small
                      label: صغير
                      maxBalls: 1
                      containerId: cup
                      prices:
                        - flavorFamily: classic
                          price: 2
                        - flavorFamily: special
                          price: 4
        "422":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/ServerError"

  /menu/products/{slug}:
    get:
      tags: [Menu]
      summary: Get product by slug
      description: |
        Public product detail for `/menu/order/{type}` — looked up by the
        product's **`slug`** column (route-model-bind on `slug`, NOT the
        primary key). In Laravel: `Route::get('products/{product:slug}', ...)`.
        The response's `id` is still the internal PK to send back when
        POSTing cart/order data. Matches TypeScript `IProduct`.

        **Contract (handoff 02 · 05 · 06 · 07):**
        - Builder products with a flavor step (`cup`, `family`, `brad-boza`)
          MUST include `flavors[]`; every flavor includes `available` even when
          `false`. List endpoint omits `flavors`.
        - `family` detail MUST return a non-empty `flavors[]`.
        - Brad-boza: single product `image` only — **no** `secondaryImage`.
          `pricingLabel` may already include «أسعار» (frontend does not
          double-prefix).
        - `containerOptions` / `sizes` / `iceCreamAddonPrices` / `mixes` are
          Filament CRUD surfaces; changes appear here without a frontend deploy.
      operationId: getMenuProductBySlug
      security: []
      parameters:
        - name: slug
          in: path
          required: true
          description: Stable URL-safe identifier (`IProductBase.slug`)
          schema:
            type: string
          example: cup
      responses:
        "200":
          description: Product detail (`IProduct`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IProduct"
              example:
                id: "b7f1c2a4-9e3d-4a10-8c21-3f5a2d1e9b04"
                slug: cup
                categoryId: ice-cream
                kind: builder
                name: بوظة كاسة
                image: https://cdn.glace.ps/menu/cup.jpg
                sortOrder: 1
                available: true
                selectionMode: repeatable
                flavorFamilies: [classic, special, mix]
                hasExtraBiscuitAddon: true
                containerOptions:
                  - id: cup
                    label: كاسة
                    available: true
                    pricingLabel: الكاسة
                  - id: biscuit
                    label: بسكوت
                    available: true
                    name: بوظة بسكوت
                    image: https://cdn.glace.ps/menu/biscuit.jpg
                    pricingLabel: البسكوت
                sizes:
                  - id: cup-small
                    label: صغير
                    maxBalls: 1
                    containerId: cup
                    prices:
                      - flavorFamily: classic
                        price: 2
                      - flavorFamily: special
                        price: 4
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"

  /menu/addons:
    get:
      tags: [Menu]
      summary: List additions catalog
      description: |
        Public shared additions (إضافات) catalog — the per-unit extras a
        customer can attach to a cart line (e.g. sauces, nuts, biscuit), each
        with its own price. Applied to any product in the cart's
        "تخصيص الإضافات" flow. A product MAY override this shared list with its
        own `IProductBase.addons`. Matches TypeScript `IAddonOption[]`.
      operationId: getMenuAddons
      security: []
      responses:
        "200":
          description: Additions catalog (`IAddonOption[]`)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/IAddonOption"
              example:
                - id: extra-biscuit
                  label: بسكوت مخروط
                  price: 3
                  available: true
                  type: counter
                  maxQty: 10
                - id: extra-caramel
                  label: صوص كراميل
                  price: 3
                  available: true
                  type: toggle
                - id: extra-nuts
                  label: بندق مبشور
                  price: 4
                  available: true
                  type: toggle
        "500":
          $ref: "#/components/responses/ServerError"

  # ───────────────────────────────────────────────────────────────────────────
  # Storefront accounts — handoff 08 · 09
  #
  # Passwordless. A phone number plus a code texted to it is the entire
  # credential story: there is no password, no reset, and no logout endpoint
  # (the storefront drops its own token client-side — handoff 09).
  #
  # The old password schemas (LoginRequest, RegisterRequest,
  # RestorePasswordRequest, NewPasswordRequest, ChangePasswordRequest) are
  # CANCELLED and are deliberately absent from this file.
  # ───────────────────────────────────────────────────────────────────────────

  /auth/otp/send:
    post:
      tags: [Auth]
      summary: Text a one-time login code
      description: |
        Sends a 6-digit code by SMS. Says nothing about whether the number
        already has an account — the same 200 either way.

        Rate limited on two axes, both required: a per-IP route throttle, and a
        per-number cooldown (60s) plus hourly cap (5) in the database. The
        throttle alone would let one client burn another customer SMS budget.
      operationId: sendOtp
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone]
              properties:
                phone:
                  type: string
                  description: Any form the customer types — 05…, +970…, 00970… — normalised server-side.
                  example: "0599123456"
      responses:
        "200":
          description: Code sent
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string, example: تم إرسال رمز التحقق }
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          description: Asked again too soon
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                message: الرجاء الانتظار قبل إعادة الإرسال

  /auth/otp/verify:
    post:
      tags: [Auth]
      summary: Verify the code, sign in or register
      description: |
        One call for both: a number nobody has used before becomes an account
        here, using `fullName`. An existing account KEEPS ITS STORED NAME — a
        `fullName` sent for a known number is ignored, so nobody can rename an
        account by typing on the login screen.

        The code is single-use, expires in 5 minutes, and burns after 5 wrong
        guesses. Every failure mode answers identically, so the response cannot
        be used to discover which numbers have accounts.
      operationId: verifyOtp
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, code]
              properties:
                phone: { type: string, example: "0599123456" }
                code:
                  type: string
                  pattern: "^[0-9]{6}$"
                  example: "482913"
                fullName:
                  type: string
                  description: Required in practice only for a number with no account yet.
                  example: أحمد علي
      responses:
        "200":
          description: Signed in
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                    description: |
                      Sent back as `Authorization: <token>` — NO `Bearer`
                      prefix. Only its SHA-256 is stored server-side.
                  user: { $ref: "#/components/schemas/AuthUser" }
        "422":
          $ref: "#/components/responses/ValidationError"

  /auth/me:
    get:
      tags: [Account]
      summary: The signed-in customer
      operationId: getMe
      responses:
        "200":
          description: Current customer
          content:
            application/json:
              schema:
                type: object
                properties:
                  user: { $ref: "#/components/schemas/AuthUser" }
        "401":
          $ref: "#/components/responses/Unauthorized"

  /auth/profile:
    put:
      tags: [Account]
      summary: Update the profile
      description: |
        Three fields, no avatar and no password.

        `email` is optional in the strong sense: absent, `null` and `""` are all
        accepted, and only a value that was actually sent is validated for
        format and uniqueness. The identity is the phone number.
      operationId: updateProfile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:  { type: string, example: أحمد علي }
                email: { type: string, nullable: true, example: ahmed@example.com }
                phone: { type: string, example: "0599123456" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  user: { $ref: "#/components/schemas/AuthUser" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationError"

  # ───────────────────────────────────────────────────────────────────────────
  # Saved addresses & delivery zones — handoff 10
  # ───────────────────────────────────────────────────────────────────────────

  /addresses:
    get:
      tags: [Addresses]
      summary: List saved addresses
      description: The signed-in customer addresses, default first.
      operationId: getAddresses
      responses:
        "200":
          description: Addresses
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SavedAddress" }
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [Addresses]
      summary: Save an address
      description: |
        `id` and `isDefault` are computed server-side — the first address a
        customer saves becomes their default automatically.
      operationId: createAddress
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AddressInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  address: { $ref: "#/components/schemas/SavedAddress" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationError"

  /addresses/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, example: addr_01j8z3k9 }
    put:
      tags: [Addresses]
      summary: Replace an address
      description: A full replacement, not a patch. `isDefault` is moved by its own endpoint.
      operationId: updateAddress
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AddressInput" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  address: { $ref: "#/components/schemas/SavedAddress" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
    delete:
      tags: [Addresses]
      summary: Delete an address
      description: |
        Deleting the default hands the flag to another address automatically,
        so a customer never has addresses but no default.
      operationId: deleteAddress
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string, example: تم حذف العنوان }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /addresses/{id}/default:
    post:
      tags: [Addresses]
      summary: Make this the default address
      operationId: makeAddressDefault
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  address: { $ref: "#/components/schemas/SavedAddress" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /addresses/delivery-zones:
    get:
      tags: [Addresses]
      summary: Delivery areas and their fees
      description: |
        Replaces the frontend hardcoded `src/lib/deliveryZones.ts`, field for
        field. Public: checkout needs fees before anyone signs in.
      operationId: getDeliveryZones
      security: []
      responses:
        "200":
          description: Zones
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/DeliveryZone" }
              example:
                - id: rimal
                  name: الرمال
                  description: حي الرمال
                  fee: 10
                - id: shejaiya
                  name: الشجاعية
                  fee: 15

  # ───────────────────────────────────────────────────────────────────────────
  # Coupons — handoff 11
  # ───────────────────────────────────────────────────────────────────────────

  /cart/apply-coupon:
    post:
      tags: [Cart]
      summary: Preview a discount code
      description: |
        A PREVIEW. Nothing is reserved and no code is spent here — `POST /orders`
        re-evaluates the code from scratch and ignores any `discount` the client
        sends.

        `discount` is always a final shekel figure, computed server-side,
        whether the coupon is a fixed amount or a percentage.

        Auth is optional: the cart works signed out, but a per-customer usage
        limit can only be checked when we know who is asking.
      operationId: applyCoupon
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, subtotal]
              properties:
                code:     { type: string, example: GLACE10 }
                subtotal: { type: number, format: float, example: 85 }
      responses:
        "200":
          description: |
            Answered whether or not the code was valid — an unknown code is
            `valid: false` with 200, never an error status.
          content:
            application/json:
              schema:
                type: object
                required: [valid, discount, message]
                properties:
                  valid:    { type: boolean }
                  code:     { type: string, description: Present only when valid. }
                  discount: { type: number, format: float }
                  message:  { type: string }
              examples:
                valid:
                  value: { valid: true, code: GLACE10, discount: 10, message: تم تطبيق الكوبون }
                invalid:
                  value: { valid: false, discount: 0, message: الكوبون غير صالح أو منتهي }
        "422":
          $ref: "#/components/responses/ValidationError"

  # ───────────────────────────────────────────────────────────────────────────
  # Orders — handoff 12
  # ───────────────────────────────────────────────────────────────────────────

  /orders:
    get:
      tags: [Orders]
      summary: The customer orders, paginated
      operationId: getOrders
      parameters:
        - { name: page,    in: query, schema: { type: integer, default: 1 } }
        - { name: perPage, in: query, schema: { type: integer, default: 20, maximum: 50 } }
      responses:
        "200":
          description: Page of orders, newest first
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Order" }
                  total:      { type: integer, example: 47 }
                  page:       { type: integer, example: 1 }
                  perPage:    { type: integer, example: 20 }
                  totalPages: { type: integer, example: 3 }
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [Orders]
      summary: Place an order
      description: |
        **multipart/form-data**, because `receiptImage` is a real file. That has
        one consequence worth stating plainly: `items` cannot be a nested array
        in a multipart body, so it arrives as a **JSON string** in one field
        (`FormData.append("items", JSON.stringify(items))`).

        **The server prices everything.** `unitPrice`, `addonTotal`, `subtotal`,
        `discount` and `total` may all be sent and are all DISCARDED. Only
        `productId`, the selection ids, `quantity` and `couponCode` are read;
        every amount is re-derived from the catalog as it stands right now.

        Other rules enforced here:
        - a `delivery` order containing an item that cannot be delivered is 422
        - `cash` and `visa` are in-store only and cannot pay for a delivery
        - `addressId` must belong to the signed-in customer, and is snapshotted
          onto the order (including the zone name at the time)
        - `couponCode` is re-validated; a code that expired since the cart
          screen is a 422, not a silently dropped discount
        - `paymentMethod: jawwal` verifies `jawwalPhone`/`jawwalCode` BEFORE
          anything is written — a bad code leaves no order behind
        - `paymentMethod: wallet` debits inside the same transaction, so a
          debit cannot survive an order that failed to save
        - the status is ALWAYS `قيد المراجعة`, whatever was paid and however

        Auth is optional: a signed-in order is bound to the account, and a guest
        still gets a one-time `token` back so they can track what they ordered.
      operationId: createOrder
      security: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [items, paymentMethod, deliveryMethod]
              properties:
                items:
                  type: string
                  description: JSON-encoded `CartItem[]` — see the CartItem schema.
                paymentMethod:  { $ref: "#/components/schemas/PaymentMethod" }
                deliveryMethod: { $ref: "#/components/schemas/DeliveryMethod" }
                addressId:
                  type: string
                  description: Required for `delivery`. Must be one the customer owns.
                couponCode:  { type: string }
                pickupTime:  { type: string, format: date-time }
                notes:       { type: string }
                receiptImage:
                  type: string
                  format: binary
                  description: |
                    For `jawwal-manual` · `paypal` · `bop`. Max 5 MB; the real
                    MIME type is sniffed server-side, not taken from the request.
                receiptNote:
                  type: string
                  description: Accepted instead of the image for the same methods.
                jawwalPhone: { type: string, description: "paymentMethod jawwal only." }
                jawwalCode:  { type: string, description: "paymentMethod jawwal only." }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Order"
                  - type: object
                    properties:
                      token:
                        type: string
                        description: |
                          Returned exactly once, at creation. Lets a guest track
                          the order (`GET /orders/{id}?token=…`).
        "409":
          description: Wallet balance will not cover the total
        "422":
          $ref: "#/components/responses/ValidationError"

  /orders/jawwal/send-code:
    post:
      tags: [Orders]
      summary: Start the automatic Jawwal Pay flow
      description: |
        Texts a confirmation code for `amount`. No order exists yet — the code
        is proved by the `POST /orders` that follows, which also checks the
        amount still matches (a changed cart needs a fresh code).
      operationId: sendJawwalCode
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, amount]
              properties:
                phone:  { type: string, example: "0599123456" }
                amount: { type: number, format: float, example: 42.5 }
      responses:
        "200":
          description: Sent
          content:
            application/json:
              schema:
                type: object
                properties:
                  sent: { type: boolean, example: true }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429":
          description: Asked again too soon for this number

  /orders/{id}:
    get:
      tags: [Orders]
      summary: One order
      description: |
        Readable by the owning customer, or by a guest presenting the `token`
        the creation call returned. Anything else is 404 — never a 403, which
        would confirm the reference exists.
      operationId: getOrder
      security: []
      parameters:
        - { name: id,    in: path,  required: true, schema: { type: string, example: ORD-M3K2A1 } }
        - { name: token, in: query, schema: { type: string }, description: Guest access. }
      responses:
        "200":
          description: Order
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Order" }
        "404": { $ref: "#/components/responses/NotFound" }

  /orders/{id}/cancel:
    post:
      tags: [Orders]
      summary: Cancel an order
      description: |
        Moves the order to `ملغي` and stores the reason.

        **No refund happens here.** A paid amount stays under review until
        support has checked it; moving to `مسترد` and returning money to the
        wallet is a separate decision made in the dashboard.
      operationId: cancelOrder
      security: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string, example: غيرت رأيي }
      responses:
        "200":
          description: Cancelled
          content:
            application/json:
              schema:
                type: object
                properties:
                  order: { $ref: "#/components/schemas/Order" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: The order is already in a final state

  /orders/{id}/receipt:
    post:
      tags: [Orders]
      summary: Re-upload proof of transfer
      description: |
        For `RECEIPT_METHODS` orders only. Does not change the order status.
      operationId: uploadOrderReceipt
      security: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                receiptImage: { type: string, format: binary }
                receiptNote:  { type: string }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  order: { $ref: "#/components/schemas/Order" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /orders/{id}/received:
    post:
      tags: [Orders]
      summary: Customer confirms a delivery arrived
      description: Moves the order to `تم الاستلام` and records `receivedAt`.
      operationId: confirmOrderReceived
      security: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Confirmed
          content:
            application/json:
              schema:
                type: object
                properties:
                  order: { $ref: "#/components/schemas/Order" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: The order is already in a final state }
        "422": { description: Not a delivery order }

  /orders/{id}/email-summary:
    post:
      tags: [Orders]
      summary: Mail the order summary
      description: |
        Sent to whatever address the customer types — not tied to the account
        e-mail. Does not change the order.
      operationId: emailOrderSummary
      security: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        "200":
          description: Sent
          content:
            application/json:
              schema:
                type: object
                properties:
                  sent: { type: boolean, example: true }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }

  # ───────────────────────────────────────────────────────────────────────────
  # Payment accounts — handoff 13
  # ───────────────────────────────────────────────────────────────────────────

  /payment-accounts:
    get:
      tags: [Payments]
      summary: Where the shop is paid, for manual transfers
      description: |
        Replaces `src/lib/merchantPaymentAccounts.ts`. `bankName` is present
        only for bank methods and is omitted entirely for wallets.
      operationId: getPaymentAccounts
      security: []
      responses:
        "200":
          description: Accounts
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/MerchantPaymentAccount" }

  # ───────────────────────────────────────────────────────────────────────────
  # Wallet — handoff 14
  #
  # Note what is absent: nothing here approves a top-up. That decision belongs
  # to the Filament dashboard and to nowhere a customer can reach.
  # ───────────────────────────────────────────────────────────────────────────

  /wallet:
    get:
      tags: [Wallet]
      summary: Balance and statement
      operationId: getWallet
      responses:
        "200":
          description: Wallet
          content:
            application/json:
              schema:
                type: object
                properties:
                  balance: { type: number, format: float, example: 105.25 }
                  transactions:
                    type: array
                    items: { $ref: "#/components/schemas/WalletTransaction" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /wallet/deduct:
    post:
      tags: [Wallet]
      summary: Spend credit
      description: |
        The server is the arbiter of whether the balance covers it — never the
        frontend copy of the number. An order paid with `wallet` debits inside
        order creation instead, so the two cannot come apart.
      operationId: deductFromWallet
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount]
              properties:
                amount: { type: number, format: float, example: 22.5 }
                label:  { type: string, example: "دفع طلب #ORD-M3K2" }
      responses:
        "200":
          description: New balance
          content:
            application/json:
              schema:
                type: object
                properties:
                  balance: { type: number, format: float, example: 82.75 }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409":
          description: Insufficient balance
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { message: الرصيد غير كافٍ }

  /wallet/topup-requests:
    get:
      tags: [Wallet]
      summary: The customer top-up requests
      operationId: getTopUpRequests
      responses:
        "200":
          description: Requests
          content:
            application/json:
              schema:
                type: object
                properties:
                  requests:
                    type: array
                    items: { $ref: "#/components/schemas/TopUpRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [Wallet]
      summary: Ask to add credit
      description: |
        **Adds nothing to the balance.** The request stays `قيد المراجعة` until
        an admin approves it in the dashboard.

        Either a receipt image or a note is required — a transfer with no
        evidence cannot be matched by the person reviewing it.
      operationId: createTopUpRequest
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [amount, method]
              properties:
                amount: { type: number, format: float, example: 50 }
                method: { $ref: "#/components/schemas/TopUpMethod" }
                receiptImage: { type: string, format: binary }
                receiptNote:  { type: string }
                phone:        { type: string, description: Automatic Jawwal flow only. }
      responses:
        "201":
          description: Logged, pending review
          content:
            application/json:
              schema:
                type: object
                properties:
                  request: { $ref: "#/components/schemas/TopUpRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ValidationError" }

  # ───────────────────────────────────────────────────────────────────────────
  # Dashboard-owned content — handoff 15 · 16 · 17
  # ───────────────────────────────────────────────────────────────────────────

  /help/faqs:
    get:
      tags: [Content]
      summary: Help page questions
      description: Array order is display order. No pagination.
      operationId: getFaqs
      security: []
      responses:
        "200":
          description: FAQs
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Faq" }

  /terms:
    get:
      tags: [Content]
      summary: Terms and conditions
      description: |
        A single HTML string, not an array of sections. Only `h3`, `p`,
        `ul`/`li` and `a` survive: the backend sanitises on save AND on read.

        The frontend sanitises independently with DOMPurify before
        `dangerouslySetInnerHTML` — neither side treats the other pass as
        sufficient (handoff 16).
      operationId: getTerms
      security: []
      responses:
        "200":
          description: HTML
          content:
            application/json:
              schema: { type: string }
              example: "<h3>1. قبول الشروط</h3><p>استخدامك لتطبيق جلاسيه الأمير…</p>"

  /privacy:
    get:
      tags: [Content]
      summary: Privacy policy
      description: Same shape and the same double sanitisation as `/terms`.
      operationId: getPrivacy
      security: []
      responses:
        "200":
          description: HTML
          content:
            application/json:
              schema: { type: string }
              example: "<h3>1. المعلومات التي نجمعها</h3><p>نجمع فقط ما نحتاجه…</p>"


components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Token from login. Sent as:
        `Authorization: <token>`
        (matches the frontend `userApi` axios interceptor)

  schemas:
    Error:
      type: object
      required: [message]
      properties:
        message:
          type: string
          example: Something went wrong
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
          example:
            email: ["The email field is required."]

    # --- Auth ---
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          example: user@example.com
        password:
          type: string
          format: password
          example: secret123
        rememberMe:
          type: boolean
          default: false

    LoginResponse:
      type: object
      properties:
        token:
          type: string
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        user:
          $ref: '#/components/schemas/User'

    RegisterRequest:
      type: object
      required: [fullName, email, phone, password, confirmPassword]
      properties:
        fullName:
          type: string
          example: Ahmed Ali
        email:
          type: string
          format: email
        phone:
          type: string
          example: "+9665XXXXXXXX"
        password:
          type: string
          format: password
        confirmPassword:
          type: string
          format: password

    RestorePasswordRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email

    NewPasswordRequest:
      type: object
      required: [password, confirmPassword]
      properties:
        password:
          type: string
          format: password
        confirmPassword:
          type: string
          format: password

    ChangePasswordRequest:
      type: object
      required: [currentPassword, newPassword, confirmPassword]
      properties:
        currentPassword:
          type: string
          format: password
        newPassword:
          type: string
          format: password
        confirmPassword:
          type: string
          format: password

    # --- User ---
    User:
      type: object
      properties:
        id:
          type: integer
          example: 1
        fullName:
          type: string
          example: Ahmed Ali
        email:
          type: string
          format: email
        phone:
          type: string
          example: "+9665XXXXXXXX"

    UpdateProfileRequest:
      type: object
      properties:
        fullName:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string

    # --- Contact (matches src/types/contact.types.ts) ---
    IContactRequest:
      type: object
      description: Matches TypeScript `IContactRequest`
      required:
        - name
        - phone
        - email
        - message
      properties:
        name:
          type: string
          example: أحمد علي
        phone:
          type: string
          example: "0592123456"
        email:
          type: string
          format: email
          example: ahmed@example.com
        subject:
          type: string
          description: Optional subject (not used by current UI)
        message:
          type: string
          example: أريد الاستفسار عن العروض الحالية
      example:
        name: أحمد علي
        phone: "0592123456"
        email: ahmed@example.com
        message: أريد الاستفسار عن العروض الحالية

    IContactResponse:
      type: object
      description: Matches TypeScript `IContactResponse`
      required:
        - success
        - message
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: تم إرسال رسالتك بنجاح
      example:
        success: true
        message: تم إرسال رسالتك بنجاح

    # Legacy alias (prefer IContactRequest)
    ContactRequest:
      allOf:
        - $ref: "#/components/schemas/IContactRequest"

    # --- Shared ---
    SuccessMessage:
      type: object
      properties:
        message:
          type: string
          example: Operation completed successfully

    # --- Home (matches src/types/home.types.ts) ---
    IHomePageData:
      type: object
      description: Full payload for GET /home — matches TypeScript `IHomePageData`
      required:
        - hero
        - about
        - whyGlace
        - branches
        - events
      properties:
        hero:
          $ref: "#/components/schemas/IHomeHero"
        about:
          $ref: "#/components/schemas/IHomeAboutData"
        whyGlace:
          $ref: "#/components/schemas/IHomeWhyGlaceData"
        branches:
          $ref: "#/components/schemas/IHomeBranchesData"
        events:
          $ref: "#/components/schemas/IHomeEventsData"
      example:
        hero:
          slides:
            - manImg: https://cdn.glace.ps/home/hero/man-1.png
              pieceImg: https://cdn.glace.ps/home/hero/piece-1.png
              zigzagsImg: https://cdn.glace.ps/home/hero/zigzags.png
              titleH1: جلاسية الأمير
              titleH2: لإنتاج الآيس كريم و البراد و العصائر و الحلويات
              bgColor: "#51C9F4"
              headerBgColor: "#51c9f4"
              h1BgColor: "#53352a"
              h2BgColor: "#51c9f4"
        about:
          title: موهوبون في صناعة الأيسكريم !
          paragraphs:
            - تأسس جلاسيه الأمير عام 2015...
            - تعمل الشركة على تقديم أجود أنواع الآيس كريم...
          image: https://cdn.glace.ps/home/about/character.png
          ctaLabel: اعرف أكثر
          ctaHref: /about
        whyGlace:
          title: لماذا جلاسيه الأمير؟
          description: جلاسيه الأمير حاصلة على شهادة الجودة العالمية لسلامة الغذاء ISO 22000
          features:
            - label: جودة عالية
