        listImage:
          type: string
          format: uri
          description: |
            Card thumbnail — absolute URL (handoff 04). Upload from Filament
            «صورة البطاقة». Must not be null for published events.
          example: https://cdn.glace.ps/events/2-list.png
        images:
          type: array
          description: |
            Detail gallery (handoff 04). Absolute URL strings only.
            **No `null` entries** — use `[]` when empty. Managed via Filament
            multi-upload / repeater (not the card image field alone).
          items:
            type: string
            format: uri
            nullable: false
          example:
            - https://cdn.glace.ps/events/2-a.png
            - https://cdn.glace.ps/events/2-b.png
