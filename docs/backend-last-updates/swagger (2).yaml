            images:
              - https://cdn.glace.ps/events/2-a.png
        total: 10
        page: 1
        perPage: 8
        totalPages: 2

    IMenuCategory:
      type: object
      description: Matches TypeScript `IMenuCategory`
      required: [id, label, icon, accentColor, gradientFrom, gradientTo, sortOrder]
      properties:
        id:
          type: string
          example: pancake
        label:
          type: string
          example: بان كيك
        icon:
          type: string
          enum: [ice-cream, cup-soda, cake, glass-water, milk, apple]
          example: cake
        available:
          type: boolean
          default: true
          description: |
            Omit or `true` when the category is shown. `false` hides the whole
            section from the menu (e.g. hot drinks during summer).
          example: true
        accentColor:
          type: string
          example: "#f4a851"
        gradientFrom:
          type: string
          example: "#f4a851"
        gradientTo:
          type: string
          example: "#c97d2a"
        sortOrder:
          type: integer
          example: 11

    IFlavorOption:
      type: object
      description: |
        Matches TypeScript `IFlavorOption`.

        **handoff 02:** `available` is always required — send `false` for
        paused flavors. Do not omit the key when false (breaks frontend parse
        on cup / brad-boza). `family` detail must return a non-empty
        `flavors[]` with the same shape.
      required: [id, nameAr, nameEn, image, family, available]
      properties:
        id:
          type: string
          example: pistachio
        nameAr:
          type: string
          example: بيستاشيو
        nameEn:
          type: string
          example: Pistachio
        image:
          type: string
          format: uri
          description: Absolute flavor image URL — no `cdn.example.com` (handoff 03)
        family:
          type: string
          enum: [classic, special, stevia]
        available:
          type: boolean
          description: |
            Always present. `true` = orderable; `false` = shown disabled.
            Never drop this field when false.
          example: false
        isPremiumMixFlavor:
          type: boolean
          description: Priced at a mix's premiumFlavorPrice instead of flavorPrice

    IProductVariant:
      type: object
      description: |
        Matches TypeScript `IProductVariant` — one row in a flat-list product.

        **handoff 01:** `image` is required for every item (all 15 flat-list
        products / 69 variants). Used on the order list AND inside the mix /
        super-mix modal. Upload per item from Filament (not only product.image).
      required: [id, label, price, available, image]
      properties:
        id:
          type: string
          description: |
            Stable, dashboard-safe identifier, unique within the product.
            Mixes reference items by THIS id (`IMixRule.itemIds`), so renaming
            `label` from the dashboard never breaks a mix rule.
          example: nutella
        label:
          type: string
          example: نوتيلا
        price:
          type: number
          example: 11
        description:
          type: string
        image:
          type: string
          format: uri
          description: |
            Per-item thumbnail — absolute URL. Required on every `items[]`
            entry (handoff 01). Empty/missing → blank circle in UI.
          example: https://cdn.glace.ps/menu/pancake-nutella.jpg
        available:
          type: boolean
        isPremiumMixFlavor:
          type: boolean
          description: |
            When true inside a mix, charge `premiumFlavorPrice` instead of
            `flavorPrice`. Toggle from Filament on the item (handoff 07).

    IMixRule:
      type: object
      description: |
        Matches TypeScript `IMixRule` — مكس / سوبر مكس on flat-list products.

        **handoff 07:** full CRUD from Filament (label, pick, prices, itemIds,
        available). `itemIds` reference `items[].id` on the same product only.
      required: [id, label, pick, basePrice, flavorPrice, premiumFlavorPrice, itemIds]
      properties:
        id:
          type: string
          description: Stable seed id (`mix`, `super-mix`) — do not rename after orders exist
          example: mix
        label:
          type: string
          example: مكس (اختر طعمين)
        available:
          type: boolean
          default: true
          description: |
            Prefer always sending the field. `false` hides this mix on the
            order page. Omit or `true` = offered.
          example: true
        pick:
          type: integer
          example: 2
        basePrice:
          type: number
          example: 14
        flavorPrice:
          type: number
          example: 7
        premiumFlavorPrice:
          type: number
          example: 11
        itemIds:
          type: array
          description: |
            Ids of the `items[]` this mix can be built from — these are
            `IProductVariant.id` values on the SAME product.

            NOT flavor ids, and NOT labels. (This field was previously named
            `flavorOptionIds` and held Arabic labels; matching by label broke
            whenever an item was renamed from the dashboard.)
          items:
            type: string
          example: [nutella, lotus, pistachio]

    IPriceCell:
      type: object
      description: Matches TypeScript `IPriceCell`
      required: [flavorFamily, price]
      properties:
        flavorFamily:
          type: string
          enum: [classic, special, mix]
        price:
          type: number
          example: 4

    IContainerOption:
      type: object
      description: |
        Matches TypeScript `IContainerOption` — builder "type" pills
        (كاسة/بسكوت, ليمون/مانجا, بلاستيك/فلين…).

        **handoff 05:** full Filament CRUD (add / edit / delete / available /
        image / pricingLabel). Not step titles — those stay frontend-only.
      required: [id, label, available]
      properties:
        id:
          type: string
          example: biscuit
        label:
          type: string
          example: بسكوت
        available:
          type: boolean
        name:
          type: string
          description: Overrides the product's own name when this container is picked
          example: بوظة بسكوت
        image:
          type: string
          format: uri
          description: Absolute URL — fallback thumbnail when size.image is missing
        pricingLabel:
          type: string
          description: Heading for this container's price table, e.g. "الكاسة"
          example: الكاسة

    ISizeOption:
      type: object
      description: |
        Matches TypeScript `ISizeOption`.

        **handoff 05:** Filament CRUD for sizes + `prices[]` + optional
        `image` (strongly preferred for family merged rows).
      required: [id, label, maxBalls, prices]
      properties:
        id:
          type: string
          example: plastic-half
        label:
          type: string
          example: 1/2 لتر
        maxBalls:
          type: integer
          example: 8
        prices:
          type: array
          items:
            $ref: "#/components/schemas/IPriceCell"
        containerId:
          type: string
          description: Restricts this size to one IContainerOption id
          example: plastic
        available:
          type: boolean
          default: true
          description: |
            Omit or `true` when the size is orderable. `false` renders the size
            greyed with a "غير متوفر" badge instead of removing it.

            Needed to stop a single size independently of its container — e.g.
            بوظة عائلي merges container+size into one step, so disabling
            "1 لتر فلين" must be possible without disabling "1/2 لتر فلين".
          example: true
        image:
          type: string
          format: uri
          description: |
            Thumbnail for this size on the order page (especially family
            merged "نوع + حجم" rows). Preferred over `containerOptions[].image`
            when both are set. Absolute URL via Storage::url(...) (handoff 05).
          example: https://cdn.glace.ps/menu/sizes/family-plastic-half.png

    IProductBase:
      type: object
      description: Fields shared by every IProduct variant (see the `kind` discriminator on IProduct)
      required: [id, slug, categoryId, name, image, sortOrder, available]
      properties:
        id:
          type: string
          description: |
            Opaque backend primary key (auto-increment int or UUID). Used for
            cart/order/favorites references sent back to the API — NEVER
            rendered in a URL. Do not assume it equals `slug`.
          example: "a1c3e5f7-1111-4b22-9c33-aa44bb55cc66"
        slug:
          type: string
          description: |
            Stable, URL-safe identifier matched against `/menu/order/{type}`
            and used to fetch the product (`GET /menu/products/{slug}`). Must be
            unique and stable — renaming the display `name` must NOT change it.
          example: pancake
        categoryId:
          type: string
          example: pancake
        name:
          type: string
          example: بان كيك
        description:
          type: string
          description: Short product description shown on the order page
          example: بان كيك طازج بنكهات متنوعة
        image:
          type: string
          format: uri
          description: |
            Product hero image — absolute URL. Brad-boza uses **this field only**
            (no companion / secondary cup image — handoff 06).
          example: https://cdn.glace.ps/menu/pancake.jpg
        sortOrder:
          type: integer
          example: 1
        available:
          type: boolean
        addons:
          type: array
          description: |
            Optional per-unit extras a customer can add to this product
            (toppings, sauces...). Drives the cart's "تخصيص الإضافات" flow,
            where the additions can be applied uniformly to all units or
            differently per individual unit.
          items:
            $ref: "#/components/schemas/IAddonOption"
        hasAddons:
          type: boolean
          description: Legacy flag — superseded by a non-empty `addons` array.
        hasNotes:
          type: boolean
        hasFavorites:
          type: boolean
        hasImageZoom:
          type: boolean
        inStoreOnly:
          type: boolean
          description: Shows an in-store-only warning before entering the order flow

    IAddonOption:
      type: object
      description: |
        Matches TypeScript `IAddonOption` — one optional per-unit extra, served
        by `GET /menu/addons` and/or a product's `addons` catalog. Each addon's
        `type` (set in the dashboard) decides how it's picked in the cart:
        `toggle` (on/off) or `counter` (a quantity stepper, e.g. extra biscuit).
      required: [id, label, price]
      properties:
        id:
          type: string
          description: Stable slug for the addon
          example: extra-caramel
        label:
          type: string
          example: صوص كراميل إضافي
        price:
          type: number
          description: Per-unit surcharge (₪), charged per selected quantity
          example: 3
        available:
          type: boolean
        type:
          type: string
          enum: [toggle, counter]
          default: toggle
          description: |
            How the customer picks this addon — `toggle` (on/off checkbox,
            default) or `counter` (+/- quantity stepper, e.g. extra biscuit ×3).
          example: toggle
        maxQty:
          type: integer
          description: Optional cap for `counter` addons (max quantity per unit)
          example: 10

    IBuilderProduct:
      description: |
        Matches TypeScript `IBuilderProduct` — size/flavor wizard
        (cup, family, brad, brad-boza).

        **handoff 05 · 06:** Filament manages `containerOptions`, `sizes`
        (+ images/prices), and brad-boza `iceCreamAddonPrices`. Do **not**
        send `secondaryImage`. Step titles («اختر النوع» / «اختر الحجم») are
        frontend-only — not API fields.
      allOf:
        - $ref: "#/components/schemas/IProductBase"
        - type: object
          required: [kind, sizes]
          properties:
            kind:
              type: string
              enum: [builder]
            containerOptions:
              type: array
              description: Types managed from Filament (handoff 05)
              items:
                $ref: "#/components/schemas/IContainerOption"
            includesIceCreamStep:
              type: boolean
              description: |
                Brad-boza only — renders the extra ice-type + flavor-ball step.
                Does NOT imply a second hero image.
            iceCreamAddonPrices:
              type: array
              description: Brad-boza additive prices — Filament-editable (handoff 05)
              items:
                $ref: "#/components/schemas/IPriceCell"
            hasExtraBiscuitAddon:
              type: boolean
            pricingLabel:
              type: string
              description: |
                Price-table heading when sizes aren't split per container
                (handoff 06). Prefer the full title already including "أسعار"
                (e.g. "أسعار البراد"), or just the noun ("البراد") —
                the frontend only prefixes "أسعار" when missing.
                Unused when sizes carry containerId (container.pricingLabel wins).
              example: أسعار البراد
            sizes:
              type: array
              description: Sizes + prices (+ optional image) — Filament CRUD (handoff 05)
              items:
                $ref: "#/components/schemas/ISizeOption"
            selectionMode:
              type: string
              enum: [repeatable, toggle]
            flavorFamilies:
              type: array
              items:
                type: string
                enum: [classic, special, mix]
            flavors:
              type: array
              description: |
                Flavor balls served INLINE — no separate `/menu/flavors` endpoint.

                Returned by `GET /menu/products/{slug}` (detail) ONLY. The
                `GET /menu/products` list MUST omit it (handoff 02).

                Required for builder products with a non-empty `flavorFamilies`
                (`cup`, `family`, `brad-boza`). `family` MUST return a non-empty
                array. `brad` has no flavor step and does not need it.
                Every element must include `available` even when `false`.
              items:
                $ref: "#/components/schemas/IFlavorOption"

    IFlatListProduct:
      description: |
        Matches TypeScript `IFlatListProduct` — flat items + optional mixes
        (milkshake, pancake, waffle, …).

        **handoff 01 · 07:** every `items[]` row requires `image`. `mixes[]`
        (مكس / سوبر مكس) are Filament-managed when the product offers them.
      allOf:
        - $ref: "#/components/schemas/IProductBase"
        - type: object
          required: [kind, items]
          properties:
            kind:
              type: string
              enum: [flat-list]
            items:
              type: array
              description: |
                Variants shown on the order page. Each item MUST include
                `image` (handoff 01) — also used inside the mix modal.
              items:
                $ref: "#/components/schemas/IProductVariant"
            mixes:
              type: array
              description: |
                Optional mix rules (handoff 07). Filament CRUD; `available: false`
                hides the rule. `itemIds` → same product's `items[].id`.
              items:
                $ref: "#/components/schemas/IMixRule"

    IProduct:
      description: Matches TypeScript `IProduct` — discriminated union on `kind`
      oneOf:
        - $ref: "#/components/schemas/IBuilderProduct"
        - $ref: "#/components/schemas/IFlatListProduct"
      discriminator:
        propertyName: kind
        mapping:
          builder: "#/components/schemas/IBuilderProduct"
          flat-list: "#/components/schemas/IFlatListProduct"

    # ─────────────────────────────────────────────────────────────────────────
    # Storefront accounts — handoff 08 · 09
    # ─────────────────────────────────────────────────────────────────────────

    AuthUser:
      type: object
      description: |
        The same shape everywhere: `/auth/otp/verify`, `/auth/me` and
        `/auth/profile` all return this and nothing else.
      required: [id, name, email]
      properties:
        id:    { type: integer, example: 1 }
        name:  { type: string, example: أحمد علي }
        email:
          type: string
          description: |
            Always a string, never null — an account with no e-mail sends `""`.
            The frontend types this as `string`.
          example: ""
        phone: { type: string, example: "0599123456" }

    # ─────────────────────────────────────────────────────────────────────────
    # Addresses — handoff 10
    # ─────────────────────────────────────────────────────────────────────────

    AddressType:
      type: string
      enum: [home, work, other]

    GeoPoint:
      type: object
      nullable: true
      required: [lat, lng]
      properties:
        lat: { type: number, format: double, example: 31.5 }
        lng: { type: number, format: double, example: 34.46 }

    AddressInput:
      type: object
      required: [type, name, phone, street]
      properties:
        type: { $ref: "#/components/schemas/AddressType" }
        label:
          type: string
          description: |
            Required for `other`, which has no natural name. For `home`/`work`
            the server fills in المنزل / العمل when it is omitted.
          example: المنزل
        name:  { type: string, example: أحمد علي }
        phone:
          type: string
          description: |
            05XXXXXXXX. Other forms (+970…, 00970…) are accepted and normalised
            to this one; anything that is not a Palestinian mobile is 422.
          example: "0599123456"
        city:
          type: string
          description: Free text, not a picker. Defaults to غزة.
          example: غزة
        zoneId:
          type: string
          description: A `DeliveryZone.id`, which decides the delivery fee.
          example: rimal
        street:   { type: string, example: شارع الجلاء }
        landmark: { type: string, nullable: true, example: بجانب صيدلية النور }
        location: { $ref: "#/components/schemas/GeoPoint" }

    SavedAddress:
      allOf:
        - $ref: "#/components/schemas/AddressInput"
        - type: object
          required: [id, isDefault]
          properties:
            id: { type: string, example: addr_01j8z3k9 }
            isDefault:
              type: boolean
              description: |
                Exactly one of a customer addresses carries this. Set by the
                server, never by the client: the first address saved becomes
                the default, and deleting the default hands it to a survivor.

    DeliveryZone:
      type: object
      description: The exact shape of the frontend `src/lib/deliveryZones.ts` entries.
      required: [id, name, fee]
      properties:
        id:   { type: string, example: rimal }
        name: { type: string, example: الرمال }
        description:
          type: string
          description: Optional — omitted entirely rather than sent as null.
          example: حي الرمال
        fee:
          type: number
          format: float
          description: Delivery charge in ILS for this zone.
          example: 10

    # ─────────────────────────────────────────────────────────────────────────
    # Orders — handoff 12
    # ─────────────────────────────────────────────────────────────────────────

    PaymentMethod:
      type: string
      description: |
        `cash` and `visa` are in-store only and are refused for a delivery.
        `jawwal-manual`, `paypal` and `bop` are the RECEIPT_METHODS — paid
        out-of-band, with proof uploaded.
      enum: [jawwal, jawwal-manual, paypal, cash, visa, wallet, bop]

    DeliveryMethod:
      type: string
      enum: [delivery, pickup, dine-in]

    OrderStatus:
      type: string
      description: |
        The fulfilment lifecycle. The sequence differs per delivery method, and
        the server only ever advances along the right one:

        - `dine-in`  — قيد المراجعة → تم التسليم
        - `pickup`   — قيد المراجعة → جاري التحضير → جاهز للاستلام → تم التسليم
        - `delivery` — قيد المراجعة → جاري التحضير → في الطريق → تم الاستلام

        `ملغي` and `مسترد` are reachable from any live status. The final four —
        تم التسليم, تم الاستلام, ملغي, مسترد — close the order.
      enum:
        - قيد المراجعة
        - جاري التحضير
        - جاهز للاستلام
        - في الطريق
        - تم التسليم
        - تم الاستلام
        - ملغي
        - مسترد

    PaymentStatus:
      type: string
      description: |
        Independent of `status`. A cash order is unpaid for its whole life and
        still travels the full fulfilment path; a card order is paid up front
        and still has to be prepared.
      enum: [pending, awaiting_payment, paid, failed, cancelled]

    CartSelection:
      type: object
      description: |
        One thing the customer picked. `kind` says what: `item`, `mix`,
        `mixItem`, `size`, `container`, `flavor` or `addon`.

        `label` and `unitPrice` are for rendering only — the server resolves
        `id` against the catalog and derives the price itself.
      required: [id]
      properties:
        kind:      { type: string, example: addon }
        id:        { type: string, example: extra-caramel }
        label:     { type: string, example: صوص كراميل }
        qty:       { type: integer, example: 1 }
        unitPrice: { type: number, format: float, example: 3 }

    CartItem:
      type: object
      description: |
        One cart line, as sent inside the JSON-encoded `items` field.

        Two tiers of addon, charged differently:
        - `selections[kind=addon]` — per unit, so they multiply by `quantity`
        - `flatSelections` — per line, so `4 × biscuit` is four for the line

        Every price field here is IGNORED by the server.
      required: [productId, quantity]
      properties:
        productId: { type: string, format: uuid }
        name:      { type: string, example: بوظة كاسة }
        image:     { type: string, format: uri }
        type:
          type: string
          description: Size LABEL, not an id. Used only when no `size` selection was sent.
          example: صغير
        container:
          type: string
          description: Container LABEL, not an id. Same fallback role as `type`.
          example: كاسة
        selections:
          type: array
          items: { $ref: "#/components/schemas/CartSelection" }
        addonTotal:     { type: number, format: float, description: Ignored — recomputed. }
        unitPrice:      { type: number, format: float, description: Ignored — recomputed. }
        quantity:       { type: integer, example: 2 }
        flatSelections:
          type: array
          items: { $ref: "#/components/schemas/CartSelection" }
        flatAddonTotal: { type: number, format: float, description: Ignored — recomputed. }

    OrderAddress:
      type: object
      description: |
        A SNAPSHOT taken when the order was placed, not a live read. The
        customer may edit or delete the saved address afterwards, and the zone
        may be renamed — the order must still read correctly.
      properties:
        name:     { type: string, example: أحمد علي }
        phone:    { type: string, example: "0599123456" }
        city:     { type: string, example: غزة }
        area:
          type: string
          nullable: true
          description: The zone NAME as it read at order time.
          example: الرمال
        zoneId:   { type: string, nullable: true, example: rimal }
        street:   { type: string, example: شارع الجلاء }
        landmark: { type: string, nullable: true }
        note:     { type: string, nullable: true }
        location: { $ref: "#/components/schemas/GeoPoint" }

    OrderDriver:
      type: object
      nullable: true
      properties:
        id:      { type: string }
        name:    { type: string, example: محمود الأحمد }
        phone:   { type: string, example: "0599876543" }
        company: { type: string, nullable: true, example: توصيل فلسطين }

    OrderItem:
      type: object
      description: |
        The line as it was priced and stored. `image`, `name` and prices are
        snapshots — they do not change if the product is later edited or
        deleted.
      properties:
        productId:   { type: string, format: uuid, nullable: true }
        productSlug: { type: string }
        name:        { type: string }
        image:       { type: string, format: uri, nullable: true }
        type:        { type: string, nullable: true }
        container:   { type: string, nullable: true }
        selections:
          type: array
          items: { $ref: "#/components/schemas/CartSelection" }
        addonTotal: { type: number, format: float }
        flatSelections:
          type: array
          items: { $ref: "#/components/schemas/CartSelection" }
        flatAddonTotal: { type: number, format: float }
        unitPrice:      { type: number, format: float }
        quantity:       { type: integer }
        description:
          type: string
          description: Arabic one-liner for the kitchen ticket and the dashboard.
        lineTotal: { type: number, format: float }

    Order:
      type: object
      description: |
        `id` is the short public reference (`ORD-M3K2A1`) — the internal UUID is
        never published. Every amount here was computed by the server.
      required: [id, status, total]
      properties:
        id:        { type: string, example: ORD-M3K2A1 }
        reference: { type: string, example: ORD-M3K2A1 }
        status:        { $ref: "#/components/schemas/OrderStatus" }
        paymentStatus: { $ref: "#/components/schemas/PaymentStatus" }
        statusLabel:   { type: string, description: Arabic label for `paymentStatus`. }
        isFinal:
          type: boolean
          description: True once the order is delivered, received, cancelled or refunded.
        paymentMethod:  { $ref: "#/components/schemas/PaymentMethod" }
        deliveryMethod: { $ref: "#/components/schemas/DeliveryMethod" }
        customer:
          type: object
          properties:
            name:  { type: string }
            phone: { type: string }
        address: { $ref: "#/components/schemas/OrderAddress" }
        notes:   { type: string, nullable: true }
        items:
          type: array
          items: { $ref: "#/components/schemas/OrderItem" }
        subtotal:    { type: number, format: float, example: 33 }
        couponCode:  { type: string, nullable: true, example: GLACE10 }
        discount:    { type: number, format: float, example: 10 }
        deliveryFee: { type: number, format: float, example: 0 }
        total:       { type: number, format: float, example: 23 }
        currency:    { type: string, example: ILS }
        receiptImage:
          type: string
          format: uri
          nullable: true
          description: Absolute URL to the stored file — never base64.
        receiptNote: { type: string, nullable: true }
        preparationTime:
          type: integer
          nullable: true
          description: Minutes. Set by the shop, never by the client.
          example: 15
        estimatedDeliveryTime: { type: integer, nullable: true, example: 20 }
        driver: { $ref: "#/components/schemas/OrderDriver" }
        driverAssignedAt: { type: string, format: date-time, nullable: true }
        scheduledFor:     { type: string, format: date-time, nullable: true }
        cancelReason:     { type: string, nullable: true }
        createdAt:   { type: string, format: date-time }
        paidAt:      { type: string, format: date-time, nullable: true }
        cancelledAt: { type: string, format: date-time, nullable: true }
        receivedAt:  { type: string, format: date-time, nullable: true }
        deliveredAt: { type: string, format: date-time, nullable: true }

    # ─────────────────────────────────────────────────────────────────────────
    # Payments — handoff 13
    # ─────────────────────────────────────────────────────────────────────────

    MerchantPaymentAccount:
      type: object
      required: [method, holderName, primaryLabel, primaryValue]
      properties:
        method:
          type: string
          enum: [bop, jawwal-manual, paypal]
        qrImage:    { type: string, format: uri }
        holderName: { type: string, example: شركة جلاسيه الأمير }
        bankName:
          type: string
          description: Bank methods only — omitted entirely for wallets.
          example: بنك فلسطين
        primaryLabel:   { type: string, example: رقم الحساب }
        primaryValue:   { type: string, example: "123456789" }
        secondaryLabel: { type: string, example: IBAN }
        secondaryValue: { type: string, example: PS00PALS000000000000123456789 }

    # ─────────────────────────────────────────────────────────────────────────
    # Wallet — handoff 14
    # ─────────────────────────────────────────────────────────────────────────

    TopUpMethod:
      type: string
      enum: [bop, paypal, jawwal, jawwal-manual]

    WalletTransaction:
      type: object
      required: [id, date, amount, type, label]
      properties:
        id:     { type: string, example: 01j8z3k9abcdef }
        date:   { type: string, format: date-time }
        amount: { type: number, format: float, example: 50 }
        type:
          type: string
          enum: [credit, debit]
        label:  { type: string, example: شحن رصيد }
        method: { type: string, example: bop }
        receiptImage:
          type: string
          format: uri
          description: |
            The same proof that was reviewed when the top-up was approved, so
            the statement shows what the credit was based on.

    TopUpRequest:
      type: object
      required: [id, amount, method, status, createdAt]
      properties:
        id:     { type: string, example: 01j8z3k9abcdef }
        amount: { type: number, format: float, example: 50 }
        method: { $ref: "#/components/schemas/TopUpMethod" }
        status:
          type: string
          description: |
            Submitting adds nothing. Only an admin approving it in the dashboard
            moves this to مكتمل and credits the balance.
          enum: [قيد المراجعة, مكتمل, مرفوض]
        createdAt:    { type: string, format: date-time }
        receiptImage: { type: string, format: uri }
        receiptNote:  { type: string }
        phone:        { type: string, description: Automatic Jawwal flow only. }

    # ─────────────────────────────────────────────────────────────────────────
    # Content — handoff 15
    # ─────────────────────────────────────────────────────────────────────────

    Faq:
      type: object
      required: [id, question, answer]
      properties:
        id:
          type: string
          description: Stable slug the storefront uses as the accordion anchor.
          example: how-to-order
        question: { type: string, example: كيف أقدّم طلب؟ }
        answer:
          type: string
          description: |
            Paragraphs separated by a blank line. A paragraph beginning `- `
            renders as a bullet list, one bullet per line.
        link:
          type: object
          description: Optional link rendered at the end of the answer.
          properties:
            href:  { type: string, example: /contact }
            label: { type: string, example: تواصل معنا }

  responses:
    Unauthorized:
      description: Missing or invalid authentication token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    ValidationError:
      description: Validation failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    ServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

# Default security for protected routes.
# Override with `security: []` on public endpoints (e.g. login, register).
security:
  - bearerAuth: []
