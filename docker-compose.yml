# Deployment for back.glaceelameer.com
#
# The one line that matters most is the `storage-public` volume. Without it,
# `COPY . .` in the Dockerfile bakes an empty storage/app/public into every
# image, and each rebuild replaces the uploaded media with that empty snapshot
# — which is why restarting to pick up a GitHub change loses every picture
# while the database, which does have a volume, comes through untouched.
#
# If you deploy through a panel (Coolify, Dokploy, Portainer) rather than this
# file, the volume still has to be declared there. It is the mount that saves
# the files, not the file that declares it.

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: https://back.glaceelameer.com

      # Behind Cloudflare, so the app must be told to trust the proxy or it
      # builds every URL — including the /storage ones — as http.
      TRUSTED_PROXIES: "*"

      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: "3306"
      DB_DATABASE: ${DB_DATABASE:-glace}
      DB_USERNAME: ${DB_USERNAME:-glace}
      DB_PASSWORD: ${DB_PASSWORD}

      # Jobs are dispatched to this connection; the supervisord queue worker
      # is what actually runs them.
      QUEUE_CONNECTION: database

      SMS_DRIVER: hotsms
      SMS_API_URL: https://hotsms.ps
      SMS_API_USERNAME: ${SMS_API_USERNAME}
      SMS_API_PASSWORD: ${SMS_API_PASSWORD}
      SMS_SENDER: ${SMS_SENDER:-Glace}

      JAWWALPAY_ENABLED: "true"
      JAWWALPAY_BASE_URL: https://apitest.jawwalpay.ps
      JAWWALPAY_USERNAME: ${JAWWALPAY_USERNAME}
      JAWWALPAY_PASSWORD: ${JAWWALPAY_PASSWORD}
      JAWWALPAY_SECRET: ${JAWWALPAY_SECRET}

      GLACE_PRINTER_ENABLED: ${GLACE_PRINTER_ENABLED:-false}
      GLACE_PRINTER_HOST: ${GLACE_PRINTER_HOST:-}
    volumes:
      # Uploaded media. THE line that fixes the disappearing images.
      - storage-public:/var/www/html/storage/app/public
      # Logs, so a crash is still readable after the container that caused it
      # is gone.
      - storage-logs:/var/www/html/storage/logs
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-glace}
      MYSQL_USER: ${DB_USERNAME:-glace}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      # The app runs `migrate --force` on boot; starting it against a database
      # that is still initialising fails the deploy for no real reason.
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  storage-public:
  storage-logs:
  db-data:
