[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord.pid

[program:php-fpm]
command=php-fpm -F
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autorestart=true

[program:nginx]
command=nginx -g "daemon off;"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autorestart=true

# The queue. Without this block jobs are written to the `jobs` table and never
# run: QUEUE_CONNECTION defaults to `database`, so dispatching succeeds, the
# request returns 200, and nothing happens. That is how receipt printing can be
# "working" in every test and dead in production.
#
# --max-time recycles the worker hourly so a long-lived process cannot hold a
# stale copy of the code after a deploy.
[program:queue]
command=php /var/www/html/artisan queue:work --tries=3 --max-time=3600 --sleep=1
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autorestart=true
stopwaitsecs=35

# Laravel's scheduler. Harmless when nothing is scheduled, and the thing you
# discover is missing the day something is.
[program:scheduler]
command=php /var/www/html/artisan schedule:work
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autorestart=true
