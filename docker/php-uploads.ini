; The official php:*-fpm-alpine image ships without a php.ini, so PHP runs on
; its built-in defaults — including a 2 MB upload limit. The dashboard accepts
; images up to 4 MB (QR codes, receipts, product photos), and anything above
; 2 MB was rejected before Laravel ever saw it: the field simply stayed empty
; after saving, with no error the user would recognise.
upload_max_filesize = 10M
post_max_size = 20M
memory_limit = 256M
max_file_uploads = 20
